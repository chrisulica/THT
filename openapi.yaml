openapi: 3.0.3
info:
  title: Treasure Hunt Timișoara API
  description: API-ul actualizat pentru aplicația web Treasure Hunt Timișoara (React + Node.js), cu suport pentru multiple carduri de bingo prin ID, unicitate username și ștergere prieteni.
  version: 1.1.0
servers:
  - url: http://localhost:5000/api
    description: Server de dezvoltare local

tags:
  - name: Users Handling
    description: Autentificare, profiluri, username unic și gestionare prieteni
  - name: Treasure Hunt handling
    description: Gestionarea mai multor carduri de bingo prin ID, verificare locații și galerie
  - name: AI Integration
    description: Generarea de locații pe baza preferințelor utilizatorului

paths:
  # ==========================================
  # USERS HANDLING
  # ==========================================
  /auth/register:
    post:
      summary: Înregistrare utilizator nou (cu username unic)
      tags:
        - Users Handling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  example: timisoreanul_vesel
                  description: Trebuie să fie unic în baza de date
                email:
                  type: string
                  format: email
                  example: student@e-uvt.ro
                password:
                  type: string
                  format: password
                  example: parolaSecurizata123
      responses:
        '201':
          description: Utilizator înregistrat cu succes
        '400':
          description: Date invalide
        '409':
          description: Conflict - Username-ul sau email-ul există deja

  /auth/login:
    post:
      summary: Autentificare utilizator
      tags:
        - Users Handling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: student@e-uvt.ro
                password:
                  type: string
                  format: password
                  example: parolaSecurizata123
      responses:
        '200':
          description: Autentificare reușită (returnează Token JWT)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  username:
                    type: string

  /users/friends:
    get:
      summary: Listează prietenii utilizatorului
      tags:
        - Users Handling
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Listă de prieteni
    post:
      summary: Adaugă un prieten nou (Add Friend)
      tags:
        - Users Handling
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - friendUsername
              properties:
                friendUsername:
                  type: string
                  example: mihai_geo
      responses:
        '200':
          description: Prieten adăugat cu succes

  /users/friends/{friendId}:
    delete:
      summary: Șterge un prieten din listă
      tags:
        - Users Handling
      security:
        - BearerAuth: []
      parameters:
        - name: friendId
          in: path
          required: true
          schema:
            type: string
          description: ID-ul sau username-ul prietenului de șters
      responses:
        '200':
          description: Prieten șters cu succes
        '404':
          description: Prietenul nu a fost găsit în listă


  # ==========================================
  # AI INTEGRATION
  # ==========================================

  /ai_integrations/generate-bingo:
    post:
      summary: Generează un card Bingo personalizat pe baza preferințelor din quiz
      description: |
        Returnează 5 sau 9 locații potrivite din Timișoara, filtrând locațiile deja vizitate.
        Folosește GPT-4o-mini dacă `OPENAI_API_KEY` e configurată, altfel un algoritm local de scoring.
      tags:
        - AI Integration
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prefs:
                  type: object
                  properties:
                    distantaMaxima:
                      type: number
                      description: Distanța maximă acceptată față de centru (km)
                      example: 2.0
                    genFilm:
                      type: string
                      enum: [comedie, actiune, drama, romantic]
                      example: romantic
                    tipMancare:
                      type: string
                      enum: [picant, sarat, dulce, traditional]
                      example: dulce
                    bautura:
                      type: string
                      enum: [ceai, cafea, alcool, suc]
                      example: cafea
                    domenii:
                      type: array
                      items:
                        type: string
                        enum: [stiinta, arta, istorie, natura]
                      example: [arta, natura]
                    hobby:
                      type: string
                      enum: [citit, sport, crafting, filme]
                      example: citit
                alreadyVisited:
                  type: array
                  items:
                    type: integer
                  description: ID-urile locațiilor deja vizitate (excluse din card)
                  example: [1, 5]
                bingoSize:
                  type: integer
                  enum: [5, 9]
                  default: 9
                  description: Dimensiunea cardului (5 sau 9 locații)
                date:
                  type: string
                  format: date-time
                  description: Data curentă (ISO string). Dacă lipsește, se folosește data serverului.
                  example: "2026-11-14T13:00:00Z"
      responses:
        '200':
          description: Card Bingo generat cu succes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  locations:
                    type: array
                    description: Lista de locații recomandate cu coordonate GPS reale din Timișoara
                    items:
                      $ref: '#/components/schemas/Location'
                  message:
                    type: string
                    example: "Am pregătit 9 locații din Timișoara special pentru tine!"
        '400':
          description: Parametri invalizi (bingoSize sau date incorect)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
        '500':
          description: Eroare internă server
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

  /ai_integrations/events:
    get:
      summary: Returnează evenimente și activități recomandate pentru luna/anotimpul curent
      tags:
        - AI Integration
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: Luna (1-12). Dacă lipsește, se folosește luna curentă a serverului.
          example: 11
      responses:
        '200':
          description: Listă de evenimente sezoniere și lunare
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:         { type: boolean, example: true }
                  month:           { type: integer, example: 11 }
                  season:
                    type: string
                    enum: [primavara, vara, toamna, iarna]
                    example: toamna
                  seasonalEvents:
                    type: array
                    items: { type: string }
                    example: ["🍷 Festivalul Vinului Bănățean", "🎃 Halloween la Fabrica de Pensule"]
                  monthlyEvents:
                    type: array
                    items: { type: string }
                    example: ["🎬 Timișoara Film Festival", "📖 Târg de carte Gaudeamus"]
        '500':
          description: Eroare internă server
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

  /ai_integrations/completion-message:
    post:
      summary: Generează mesajul personalizat de felicitare la finalul traseului
      description: |
        Declară utilizatorul "un adevărat timișorean" și returnează un mesaj adaptat
        preferințelor și locațiilor vizitate. Folosește OpenAI GPT-4o-mini dacă e disponibil,
        altfel fallback la mesaj generat local.
      tags:
        - AI Integration
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userName, visitedLocationIds]
              properties:
                userName:
                  type: string
                  description: Prenumele utilizatorului
                  example: Maria
                visitedLocationIds:
                  type: array
                  items: { type: integer }
                  description: ID-urile locațiilor vizitate
                  example: [1, 3, 5, 9, 10]
                prefs:
                  type: object
                  properties:
                    genFilm:    { type: string, example: romantic }
                    tipMancare: { type: string, example: dulce }
                    bautura:    { type: string, example: cafea }
                    hobby:      { type: string, example: citit }
      responses:
        '200':
          description: Mesaj de felicitare generat cu succes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  title:
                    type: string
                    example: "🏆 Felicitări, Maria! Ești un adevărat timișorean!"
                  message:
                    type: string
                    example: "Bravo, Maria! Ai cucerit 5 locații din inima Timișoarei..."
                  badge:
                    type: string
                    description: Emoji simbol al realizării
                    example: "🏅"
        '400':
          description: Parametri obligatorii lipsă (userName sau visitedLocationIds gol)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
        '500':
          description: Eroare internă server
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }


  # ==========================================
  # TREASURE HUNT HANDLING (Multiple Bingos by ID)
  # ==========================================
  /hunt/bingos:
    get:
      summary: Obține toate cardurile de bingo ale utilizatorului (active și finalizate)
      tags:
        - Treasure Hunt handling
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Listă de carduri bingo asociate utilizatorului
    post:
      summary: Creează un nou card de bingo pe baza chestionarului și a zilelor alese
      tags:
        - Treasure Hunt handling
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - stayDays
                - preferences
              properties:
                stayDays:
                  type: integer
                  example: 2
                preferences:
                  type: object
      responses:
        '201':
          description: Card de bingo nou creat cu succes (returnează noul bingoId)

  /hunt/bingos/active:
    get:
      summary: Obține cardul de bingo activ (în desfășurare) al utilizatorului
      tags:
        - Treasure Hunt handling
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cardul de bingo activ sau mesaj dacă nu există niciun card în desfășurare
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasActiveCard:
                    type: boolean
                    example: true
                  bingoId:
                    type: string
                    example: bingo_demo_activ
                  card:
                    type: object
                    description: Detaliile complete ale cardului activ
                  locations:
                    type: array
                    description: Lista celor 9 locații de pe card (cu id, location_id, locationId)
                    items:
                      type: object
                  route:
                    type: object
                    properties:
                      locations:
                        type: array
                        items:
                          type: object

  /hunt/bingos/completed:
    get:
      summary: Obține lista cardurilor de bingo finalizate anterior de utilizator
      tags:
        - Treasure Hunt handling
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Listă de carduri bingo finalizate asociate utilizatorului
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    bingoId:
                      type: string
                      example: bingo_demo_completed
                    userId:
                      type: string
                    dayNumber:
                      type: integer
                      example: 1
                    totalDays:
                      type: integer
                      example: 3
                    createdAt:
                      type: string
                      format: date-time
                    completed:
                      type: boolean
                      example: true
                    completedAt:
                      type: string
                      format: date-time
                    albumPhoto:
                      type: string
                      example: https://images.unsplash.com/photo-1584448141569-69f342da535c
                    completionMessage:
                      type: string
                      example: Felicitări! Ești un adevărat timișorean!
                    locations:
                      type: array
                      items:
                        type: object

  /hunt/gallery:
    get:
      summary: Obține galeria personală a utilizatorului cu toate pozele (BeReal și albume)
      tags:
        - Treasure Hunt handling
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Galeria foto a utilizatorului cu pozele de la locații și pozele festive de album
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    example: demo_user
                  totalPhotos:
                    type: integer
                    example: 13
                  albumPhotos:
                    type: array
                    description: Pozele de album generate la finalizarea cardurilor
                    items:
                      type: object
                      properties:
                        bingoId:
                          type: string
                        dayNumber:
                          type: integer
                        photoUrl:
                          type: string
                        completionMessage:
                          type: string
                        completedAt:
                          type: string
                          format: date-time
                  locationPhotos:
                    type: array
                    description: Pozele BeReal încărcate la vizitarea locațiilor
                    items:
                      type: object
                      properties:
                        bingoId:
                          type: string
                        dayNumber:
                          type: integer
                        locationId:
                          type: string
                        locationName:
                          type: string
                        category:
                          type: string
                        photoUrl:
                          type: string
                        visitedAt:
                          type: string
                          format: date-time

  /hunt/bingos/{bingoId}:
    get:
      summary: Obține detaliile și starea unui card de bingo specific după ID
      tags:
        - Treasure Hunt handling
      security:
        - BearerAuth: []
      parameters:
        - name: bingoId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detaliile cardului de bingo cerut (locații, status vizitat/nevizitat)
        '404':
          description: Cardul de bingo nu a fost găsit

  /hunt/bingos/{bingoId}/verify:
    post:
      summary: Validează vizita la o locație (poză BeReal + GPS) pentru un anumit bingo
      tags:
        - Treasure Hunt handling
      security:
        - BearerAuth: []
      parameters:
        - name: bingoId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - locationId
                - photo
                - userLat
                - userLng
              properties:
                locationId:
                  type: string
                photo:
                  type: string
                  format: binary
                userLat:
                  type: number
                userLng:
                  type: number
      responses:
        '200':
          description: Locație marcată ca vizitată pe acest card de bingo
        '400':
          description: Utilizatorul nu este la locație sau poza este invalidă

  /hunt/bingos/{bingoId}/complete:
    post:
      summary: Finalizează cardul de bingo specificat și generează poza de album + mesaj
      tags:
        - Treasure Hunt handling
      security:
        - BearerAuth: []
      parameters:
        - name: bingoId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Card finalizat. S-a generat poza de album și mesajul de adevărat timișorean.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Coordinates:
      type: object
      description: Coordonate GPS reale (WGS84) din Timișoara
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
          format: double
          description: Latitudine GPS
          example: 45.7580
        lng:
          type: number
          format: double
          description: Longitudine GPS
          example: 21.2290

    Location:
      type: object
      description: Locație de interes din Timișoara pentru Treasure Hunt
      required:
        - id
        - name
        - description
        - address
        - distantaFataDeCentru
        - coords
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Parcul Rozelor"
        description:
          type: string
          example: "Parc emblematic din Timișoara, renumit pentru sutele de specii de trandafiri și teatrul de vară."
        address:
          type: string
          example: "Str. Academician Alexandru Borza, Timișoara"
        distantaFataDeCentru:
          type: number
          format: double
          description: Distanța în kilometri față de centrul Timișoarei
          example: 0.6
        anotimp:
          type: array
          items:
            type: string
            enum: [primavara, vara, toamna, iarna, toate]
          example: ["primavara", "vara", "toamna"]
        genFilm:
          type: array
          items:
            type: string
            enum: [comedie, actiune, drama, romantic]
          example: ["romantic", "drama"]
        tipMancare:
          type: array
          items:
            type: string
            enum: [picant, sarat, dulce, traditional]
          example: ["dulce", "traditional"]
        bautura:
          type: array
          items:
            type: string
            enum: [ceai, cafea, alcool, suc]
          example: ["ceai", "cafea", "suc"]
        domeniu:
          type: array
          items:
            type: string
            enum: [stiinta, arta, istorie, natura]
          example: ["natura", "arta"]
        hobby:
          type: array
          items:
            type: string
            enum: [citit, sport, crafting, filme]
          example: ["citit", "sport", "crafting"]
        emoji:
          type: string
          example: "🌹"
        coords:
          $ref: '#/components/schemas/Coordinates'